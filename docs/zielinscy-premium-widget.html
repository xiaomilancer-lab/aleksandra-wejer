<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psycholog Aleksandra Wejer — widget Centrum Zielińscy</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: transparent; color: #2d4739; font-family: Arial, Helvetica, sans-serif; }
    .aw-card { width: 100%; max-width: 620px; margin: 0 auto; padding: 24px; border: 1px solid #e5e1d8; border-radius: 24px; background: #f8f5f0; box-shadow: 0 16px 45px rgba(45, 71, 57, .09); }
    .aw-card__profile { display: flex; align-items: center; gap: 20px; }
    .aw-card__photo { width: 112px; height: 112px; flex: 0 0 112px; border-radius: 18px; object-fit: cover; }
    .aw-card__eyebrow { margin: 0; color: #6d7a62; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .aw-card__title { margin: 6px 0 0; color: #2d4739; font-family: Georgia, "Times New Roman", serif; font-size: 28px; line-height: 1.15; }
    .aw-card__copy { margin: 12px 0 0; color: #59645d; font-size: 15px; line-height: 1.6; }
    .aw-card__cta { display: flex; min-height: 48px; margin-top: 22px; align-items: center; justify-content: center; border-radius: 12px; background: #6d7a62; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; transition: background-color .2s ease, transform .2s ease; }
    .aw-card__cta:hover { background: #58644f; transform: translateY(-1px); }
    .aw-card__cta:focus-visible { outline: 3px solid rgba(109, 122, 98, .35); outline-offset: 3px; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .aw-card { padding: 18px; border-radius: 20px; }
      .aw-card__profile { align-items: flex-start; gap: 14px; }
      .aw-card__photo { width: 88px; height: 88px; flex-basis: 88px; border-radius: 15px; }
      .aw-card__title { font-size: 22px; }
      .aw-card__copy { font-size: 14px; }
    }
  </style>
</head>
<body>
  <aside class="aw-card" aria-labelledby="aw-card-title">
    <div class="aw-card__profile">
      <img class="aw-card__photo" src="https://aleksandrawejer.pl/images/about-aleksandra-v2.png" width="112" height="112" alt="Aleksandra Wejer" loading="lazy">
      <div>
        <p class="aw-card__eyebrow">Centrum Medyczno-Estetyczne Zielińscy Premium</p>
        <h2 class="aw-card__title" id="aw-card-title">Aleksandra Wejer</h2>
        <p class="aw-card__copy">Konsultacje dla dzieci, młodzieży, dorosłych, par i rodzin.</p>
      </div>
    </div>
    <a class="aw-card__cta" href="https://aleksandrawejer.pl/zielinscy?source=zielinscy" target="_blank" rel="noopener noreferrer">Umów wizytę online</a>
  </aside>
</body>
</html>
